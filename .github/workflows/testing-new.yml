# Runs the testing-new branch's collector once a day and commits its snapshot
# back to THAT branch. It lives on main only because GitHub fires `schedule`
# triggers from the default branch; it reads and writes nothing on main.
# See testing_new/PREREGISTRATION.md on the testing-new branch.
name: testing-new-collect

on:
  schedule:
    - cron: "40 7 * * *"       # daily, after main's collect (06:20)
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # lets the cutoff step disable this workflow

concurrency:
  group: testing-new-collect
  cancel-in-progress: false

# Feed files are committed encrypted (DATA_HANDLING.md); this decrypts and writes them.
env:
  FEED_KEY: ${{ secrets.FEED_KEY }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Stop after the final collection cutoff
        # Live collection is final: the last snapshot is 2026-11-22. The first scheduled run
        # after 2026-11-22 disables this workflow and cancels itself.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $(date -u +%F) > 2026-11-22 ]]; then
            gh workflow disable "$GITHUB_WORKFLOW" -R "$GITHUB_REPOSITORY"
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 120; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: testing-new

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Restore caches (Tranco list, OpenPhish history)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: testing-new-cache-${{ github.run_id }}
          restore-keys: testing-new-cache-

      - name: Collect
        run: python -m phishdrift.collect2

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing_new/live SEALED_SHA256.txt
          if git diff --cached --quiet; then
            echo "No new snapshot today."
            exit 0
          fi
          git commit -m "testing-new: live snapshot $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin testing-new && git push origin HEAD:testing-new && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
